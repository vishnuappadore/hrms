name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write # required for OIDC
  contents: read

env:
  AWS_REGION: ap-south-1 # keep in sync with infra/envs/prod's `region` variable

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # The app server is a t4g.small (arm64/Graviton) instance, but this runner is amd64 —
      # cross-build via QEMU so the pushed images actually have an arm64 manifest.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/keystonehr-api:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/keystonehr-api:latest

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/keystonehr-web:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/keystonehr-web:latest

      - name: Upload deploy manifests to S3
        run: |
          aws s3 cp infra/docker-compose.prod.yml "s3://${{ vars.APP_BUCKET_NAME }}/deploy/docker-compose.prod.yml"
          aws s3 cp infra/Caddyfile "s3://${{ vars.APP_BUCKET_NAME }}/deploy/Caddyfile"

      - name: Trigger deploy via SSM
        id: ssm
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.APP_SERVER_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"IMAGE_TAG=${{ github.sha }} /opt/keystone-hr/deploy.sh\"]" \
            --query "Command.CommandId" --output text)
          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deploy to finish
        run: |
          CMD_ID="${{ steps.ssm.outputs.command_id }}"
          INSTANCE_ID="${{ vars.APP_SERVER_INSTANCE_ID }}"
          for _ in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "deploy status: $STATUS"
            case "$STATUS" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
                  --query "StandardErrorContent" --output text
                exit 1 ;;
            esac
            sleep 10
          done
          echo "timed out waiting for deploy"
          exit 1
